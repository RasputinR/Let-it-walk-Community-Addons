plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'dev.walkercompat'
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    runs {
        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

dependencies {
    // Only needed to compile against; players install these mods themselves.
    compileOnly fileTree(dir: 'libs', include: ['*.jar', 'bundled/*.jar'])
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var props = [mod_id: mod_id, mod_version: mod_version]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
